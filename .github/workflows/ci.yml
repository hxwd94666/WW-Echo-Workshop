# 核验代码结构、资料与静态检查；计算/宿主验收在 Windows + Rust 环境本地执行。
name: Static checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install linter
        run: python -m pip install ruff==0.17.0
      - run: python -m ruff format --check src plugin tests tools
      - run: python -m ruff check src plugin tests tools
      - run: python -B tools/check_structure.py
      - run: python -B tools/resources.py validate
